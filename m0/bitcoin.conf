# Corky production bitcoind flags (M0 gate uses these exact values).
# Wallet-only, offline, minimal memory. No chain is ever synced.
networkactive=0
listen=0
server=1
dbcache=4
maxmempool=5
rpcthreads=1
# blocksonly is deliberately NOT set: it makes the node reject even its own
# wallet's transactions from the mempool, which breaks the M0 test harness,
# and it buys nothing on a device with networkactive=0.
# No log file at all. `debuglogfile=0` does NOT mean "off": Core reads it
# as a FILENAME and writes the log to a file called `0` in the datadir
# (seen on the board 2026-09-04). Core's own first log line warns that the
# log may contain privacy-sensitive information, so the file must not
# exist. `nodebuglogfile=1` is the switch that turns it off.
nodebuglogfile=1
