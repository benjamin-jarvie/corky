# Corky production bitcoind flags (M0 gate uses these exact values).
# Wallet-only, offline, minimal memory. No chain is ever synced.
networkactive=0
listen=0
server=1
dbcache=4
maxmempool=5
rpcthreads=1
# blocksonly is deliberately NOT set: it makes the node reject even its own
# wallet's transactions from the mempool, which breaks the M0 test harness,
# and it buys nothing on a device with networkactive=0.
# No disk persistence beyond the (ramdisk) datadir; keep logs quiet.
debuglogfile=0
shrinkdebugfile=1
